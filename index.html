  color-scheme: light;

:root[data-theme=&quot;dark&quot;] {

}

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

b,
strong,

  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;

.card {

  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);

small,
.text-small,

.text-muted {

.sr-only {

  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;

.viz-controls &gt; .form-label {

  flex: 1 1 280px;

  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {

.btn.viz-tile {

a.btn {

.btn:not(:disabled):hover {

.btn:disabled {

  min-height: 72px;
  padding: 8px 10px;

.form-control:focus-visible {
  border-color: var(--ring);

.form-control:disabled,

  opacity: 0.4;

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:

    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:

  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

  min-height: 20px;
  align-items: center;
  gap: 6px;

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);

  width: 100%;
  height: 100%;

  content: &quot;&quot;;

  height: 14px;
  border-radius: var(--radius-full);

.form-check-input[type=&quot;radio&quot;]:checked {

  background:

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

    center / 100% 2px no-repeat;

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #stats-roadmap::after {
      content: &quot;&quot;;
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: rgba(255, 252, 244, 0.04);
    }

    #stats-roadmap * {
      box-sizing: border-box;
    }

    #stats-roadmap button {
      font-family: inherit;
    }

    #stats-roadmap .roadmap-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      padding: 0.25rem 0 1.1rem;
    }

    #stats-roadmap .eyebrow {
      color: var(--roadmap-deep);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      margin: 0 0 0.3rem;
    }

    #stats-roadmap h1,
    #stats-roadmap h2,
    #stats-roadmap h3,
    #stats-roadmap p {
      margin-top: 0;
    }

    #stats-roadmap h1 {
      font-size: clamp(1.35rem, 3vw, 2rem);
      line-height: 1.35;
      margin-bottom: 0.3rem;
      color: #101610;
    }

    #stats-roadmap h2 {
      font-size: 1.12rem;
      line-height: 1.45;
      margin-bottom: 0.7rem;
      color: var(--roadmap-deep);
    }

    #stats-roadmap h3 {
      font-size: 0.96rem;
      line-height: 1.5;
      margin-bottom: 0.35rem;
    }

    #stats-roadmap .context {
      color: var(--roadmap-muted);
      margin: 0;
      font-size: 0.9rem;
    }

    #stats-roadmap .entry-badge {
      white-space: nowrap;
      margin-top: 0.25rem;
    }

    #stats-roadmap .viz-grid {
      margin-bottom: 1.15rem;
    }

    #stats-roadmap .viz-stat {
      min-height: 112px;
    }

    #stats-roadmap .viz-stat .text-muted,
    #stats-roadmap .viz-stat-value,
    #stats-roadmap .viz-stat .context {
      color: #101610;
    }

    #stats-roadmap .viz-stat-value {
      font-size: 1.5rem;
      font-weight: 500;
      line-height: 1.35;
    }

    #stats-roadmap .viz-stat .context {
      font-size: 0.78rem;
      margin-top: 0.25rem;
    }

    #stats-roadmap .section-label {
      color: var(--roadmap-muted);
      font-size: 0.78rem;
      margin: 0 0 0.45rem;
    }

    #stats-roadmap .timeline {
      position: relative;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 0.65rem;
      padding: 0.35rem 0 1.35rem;
      margin-bottom: 0.2rem;
    }

    #stats-roadmap .timeline::before {
      display: none;
    }

    #stats-roadmap .term-button {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;

        { name: &quot;تخصصی الزامی ـ انتخابی&quot;, units: 15, color: &quot;var(--viz-series-4)&quot; },
        { name: &quot;اختیاری یا کهاد&quot;, units: 18, color: &quot;var(--viz-series-5)&quot; },
        { name: &quot;مهارتی ـ اشتغال‌پذیری&quot;, units: 5, color: &quot;var(--viz-series-6)&quot; }
      ];

      const state = { semesterId: 1, courseIndex: 0 };
      const semesterTimeline = root.querySelector(&quot;#semester-timeline&quot;);
      const courseGrid = root.querySelector(&quot;#course-grid&quot;);
      const semesterTitle = root.querySelector(&quot;#semester-title&quot;);
      const semesterSubtitle = root.querySelector(&quot;#semester-subtitle&quot;);
      const semesterUnits = root.querySelector(&quot;#semester-units&quot;);
      const dependencySummary = root.querySelector(&quot;#dependency-summary&quot;);
      const dependencySvg = root.querySelector(&quot;#dependency-svg&quot;);
      const categoryBar = root.querySelector(&quot;#category-bar&quot;);
      const categoryLegend = root.querySelector(&quot;#category-legend&quot;);

      const fa = (value) =&gt; String(value).replace(/\d/g, (digit) =&gt; &quot;۰۱۲۳۴۵۶۷۸۹&quot;[digit]);
      const unitsText = (value) =&gt; `${fa(value)} واحد`;
      const clean = (value) =&gt; value.replace(/[‌\s]/g, &quot;&quot;).replace(/[۱۲۳۴۵۶۷۸۹۰]/g, (digit) =&gt; &quot;۰۱۲۳۴۵۶۷۸۹&quot;.indexOf(digit));

      const allCourses = semesters.flatMap((semester) =&gt;
        semester.courses.map((course) =&gt; ({ ...course, semester: semester.id }))
      );

      const aliasMap = new Map([
        [&quot;ریاضی۱&quot;, &quot;ریاضی عمومی ۱&quot;],
        [&quot;ریاضی۲&quot;, &quot;ریاضی عمومی ۲&quot;],
        [&quot;جبرخطی&quot;, &quot;جبرخطی برای آمار&quot;],
        [&quot;احتمال&quot;, &quot;احتمال ۱&quot;]
      ]);

      const resolveCourse = (label) =&gt; {
        const mapped = aliasMap.get(clean(label)) || label;
        const normalized = clean(mapped);
        return allCourses.find((course) =&gt; clean(course.name) === normalized) ||
          allCourses.find((course) =&gt; clean(course.name).includes(normalized) || normalized.includes(clean(course.name)));
      };

      const renderTimeline = () =&gt; {
        semesterTimeline.innerHTML = semesters.map((semester) =&gt; `
          &lt;button class=&quot;term-button&quot; type=&quot;button&quot; data-semester=&quot;${semester.id}&quot; aria-selected=&quot;${semester.id === state.semesterId}&quot; aria-label=&quot;نمایش نیمسال ${fa(semester.id)}&quot;&gt;
            &lt;span class=&quot;term-dot&quot;&gt;${fa(semester.id)}&lt;/span&gt;
            &lt;span class=&quot;term-name&quot;&gt;نیمسال ${fa(semester.id)}&lt;/span&gt;
            &lt;span class=&quot;term-units&quot;&gt;${unitsText(semester.units)}&lt;/span&gt;
          &lt;/button&gt;
        `).join(&quot;&quot;);

        semesterTimeline.querySelectorAll(&quot;[data-semester]&quot;).forEach((button) =&gt; {
          button.addEventListener(&quot;click&quot;, () =&gt; {
            state.semesterId = Number(button.dataset.semester);
            state.courseIndex = 0;
            render();
          });
        });
      };

      const renderCourses = (semester) =&gt; {
        courseGrid.innerHTML = semester.courses.map((course, index) =&gt; {
          const prerequisiteText = course.prereqs.length ? course.prereqs.join(&quot; · &quot;) : &quot;بدون پیش‌نیاز&quot;;
          return `
            &lt;button class=&quot;course-button&quot; type=&quot;button&quot; data-course=&quot;${index}&quot; aria-pressed=&quot;${index === state.courseIndex}&quot; aria-label=&quot;${course.name}، ${unitsText(course.units)}، پیش‌نیاز: ${prerequisiteText}&quot;&gt;
              &lt;span class=&quot;course-title-row&quot;&gt;
                &lt;span class=&quot;course-name&quot;&gt;${course.name}&lt;/span&gt;
                &lt;span class=&quot;viz-badge unit-badge&quot;&gt;${fa(course.units)} واحد&lt;/span&gt;
              &lt;/span&gt;
              &lt;span class=&quot;prereq&quot;&gt;&lt;strong&gt;پیش‌نیاز:&lt;/strong&gt; ${prerequisiteText}&lt;/span&gt;
            &lt;/button&gt;
          `;
        }).join(&quot;&quot;);

        courseGrid.querySelectorAll(&quot;[data-course]&quot;).forEach((button) =&gt; {
          button.addEventListener(&quot;click&quot;, () =&gt; {
            state.courseIndex = Number(button.dataset.course);
            renderCourseDetail(semester);
            courseGrid.querySelectorAll(&quot;[data-course]&quot;).forEach((item) =&gt; {
              item.setAttribute(&quot;aria-pressed&quot;, String(Number(item.dataset.course) === state.courseIndex));
            });
          });
        });
      };

      const truncate = (value, max = 25) =&gt; value.length &gt; max ? `${value.slice(0, max - 1)}…` : value;

      const renderDependency = (course) =&gt; {
        const prereqs = course.prereqs;
        const width = 440;
        const height = 192;
        const activeX = 306;
        const activeY = 70;
        const activeW = 112;
        const activeH = 56;
        const nodeW = 174;
        const nodeH = 42;
        const positions = prereqs.map((_, index) =&gt; {
          const spacing = prereqs.length &lt;= 3 ? 58 : 43;
          const start = (height - (prereqs.length - 1) * spacing) / 2;
          return { x: 24, y: start + index * spacing };
        });

        const node = (x, y, label, active = false, termLabel = &quot;&quot;) =&gt; {
          const safeLabel = truncate(label);
          const detail = termLabel ? `&lt;tspan x=&quot;${x + nodeW / 2}&quot; dy=&quot;15&quot; font-size=&quot;10&quot; opacity=&quot;0.72&quot;&gt;${termLabel}&lt;/tspan&gt;` : &quot;&quot;;
          return `
            &lt;g&gt;
              &lt;rect class=&quot;node${active ? &quot; active&quot; : &quot;&quot;}&quot; x=&quot;${x}&quot; y=&quot;${y}&quot; width=&quot;${active ? activeW : nodeW}&quot; height=&quot;${active ? activeH : nodeH}&quot; rx=&quot;10&quot;&gt;&lt;/rect&gt;
              &lt;text class=&quot;node-text${active ? &quot; active-text&quot; : &quot;&quot;}&quot; x=&quot;${x + (active ? activeW : nodeW) / 2}&quot; y=&quot;${y + (active ? 23 : 17)}&quot; text-anchor=&quot;middle&quot;&gt;
                &lt;tspan x=&quot;${x + (active ? activeW : nodeW) / 2}&quot;&gt;${safeLabel}&lt;/tspan&gt;${detail}
              &lt;/text&gt;
            &lt;/g&gt;
          `;
        };

        const edges = positions.map((position) =&gt; {
          const startX = position.x + nodeW;
          const startY = position.y + nodeH / 2;
          const endX = activeX;
          const endY = activeY + activeH / 2;
          const bend = Math.max(startX + 12, endX - 48);
          return `&lt;path class=&quot;edge&quot; d=&quot;M ${startX} ${startY} C ${bend} ${startY}, ${bend} ${endY}, ${endX} ${endY}&quot; marker-end=&quot;url(#arrow)&quot;&gt;&lt;/path&gt;`;
        }).join(&quot;&quot;);

        const defs = `
          &lt;defs&gt;
            &lt;marker id=&quot;arrow&quot; markerWidth=&quot;8&quot; markerHeight=&quot;8&quot; refX=&quot;6&quot; refY=&quot;3&quot; orient=&quot;auto&quot; markerUnits=&quot;strokeWidth&quot;&gt;
              &lt;path d=&quot;M0,0 L0,6 L6,3 z&quot; fill=&quot;currentColor&quot;&gt;&lt;/path&gt;
            &lt;/marker&gt;
          &lt;/defs&gt;
        `;
        const prerequisiteNodes = prereqs.length
          ? prereqs.map((label, index) =&gt; {
              const matched = resolveCourse(label);
              return node(positions[index].x, positions[index].y, label, false, matched ? `نیمسال ${fa(matched.semester)}` : &quot;&quot;);
            }).join(&quot;&quot;)
          : node(36, 76, &quot;بدون پیش‌نیاز&quot;, false, &quot;&quot;);

        dependencySvg.innerHTML = `${defs}&lt;title id=&quot;dependency-svg-title&quot;&gt;مسیر پیش‌نیاز ${course.name}&lt;/title&gt;&lt;desc id=&quot;dependency-svg-desc&quot;&gt;${prereqs.length ? `پیش‌نیازهای ${course.name} در سمت راست و درس منتخب در سمت چپ نمایش داده می‌شوند.` : `${course.name} پیش‌نیاز اعلام‌شده‌ای ندارد.`}&lt;/desc&gt;${prereqs.length ? edges : &quot;&quot;}${prerequisiteNodes}${node(activeX, activeY, course.name, true, `${fa(course.units)} واحد`)}`;

        dependencySummary.innerHTML = prereqs.length
          ? `&lt;strong&gt;${course.name}&lt;/strong&gt; به ${fa(prereqs.length)} پیش‌نیاز نیاز دارد: ${prereqs.join(&quot;، &quot;)}.`
          : `&lt;strong&gt;${course.name}&lt;/strong&gt; در داده ارسالی پیش‌نیاز ندارد.`;
      };

      const renderCourseDetail = (semester) =&gt; {
        const course = semester.courses[state.courseIndex] || semester.courses[0];
        state.courseIndex = semester.courses.indexOf(course);
        renderDependency(course);
      };

      const renderCategories = () =&gt; {
        const total = categories.reduce((sum, category) =&gt; sum + category.units, 0);
        categoryBar.innerHTML = categories.map((category) =&gt; {
          const width = (category.units / total) * 100;
          return `&lt;span class=&quot;category-segment&quot; style=&quot;width:${width}%;background:${category.color}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;`;
        }).join(&quot;&quot;);
        categoryLegend.innerHTML = categories.map((category) =&gt; `
          &lt;div class=&quot;legend-item&quot;&gt;
            &lt;span class=&quot;legend-swatch&quot; style=&quot;background:${category.color}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;legend-text&quot;&gt;${category.name}&lt;span&gt;${unitsText(category.units)} · ${fa(Math.round((category.units / total) * 100))}٪&lt;/span&gt;&lt;/span&gt;
          &lt;/div&gt;
        `).join(&quot;&quot;);
      };

      const render = () =&gt; {
        const semester = semesters.find((item) =&gt; item.id === state.semesterId) || semesters[0];
        semesterTitle.textContent = `نیمسال ${fa(semester.id)}`;
        semesterSubtitle.textContent = `${fa(semester.courses.length)} درس · ${unitsText(semester.units)} · انتخاب یک درس برای دیدن مسیر پیش‌نیاز`;
        semesterUnits.textContent = unitsText(semester.units);
        renderTimeline();
        renderCourses(semester);
        renderCourseDetail(semester);
      };

      renderCategories();
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;

&lt;/body&gt;

"></iframe>
